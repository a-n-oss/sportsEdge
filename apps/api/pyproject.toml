[project]
name = "sportsedge-api"
version = "1.0.0"
description = "SportsEdge FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "apscheduler>=3.10.4",
    "httpx>=0.27.0",
    "hishel[async,httpx]>=1.3.0",
    "diskcache>=5.6.3",
    "greenlet>=3.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.4.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.1",
    "pytest-cov>=4.1.0",
    "mypy>=1.10.0",
    "testcontainers>=4.4.1",
]

[tool.uv]
package = false
